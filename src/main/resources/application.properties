spring.application.name=foodapp

# ──── Database (PostgreSQL via docker-compose.yaml) ────
# spring-boot-docker-compose starts the 'postgres' service in compose.yaml and
# auto-configures spring.datasource.* from it, so no manual url/username/password needed.
spring.docker.compose.enabled=true
# Boot skips Docker Compose lifecycle management during tests by default; @SpringBootTest/
# @DataJpaTest need the same auto-configured datasource as the running app, so keep it enabled.
spring.docker.compose.skip.in-tests=false

# ──── JPA / Hibernate ────
# Schema is owned by Flyway (see below) — Hibernate only verifies the JPA mappings agree
# with what Flyway already created; it may never change the schema itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ──── Flyway (schema migrations) ────
# Versioned SQL migrations live in src/main/resources/db/migration (V1 = baseline schema,
# V2 = seed data; reserved for this and upcoming tasks up to V7 — do not reuse a version).
# baseline-on-migrate + baseline-version=1 let a database that was already created by the
# old ddl-auto=update path (no flyway_schema_history table yet, but a schema that already
# matches V1) adopt Flyway without Flyway trying to re-run V1 against tables that already
# exist: on first connect, Flyway records V1 itself as the baseline marker (a no-op — it is
# never executed) and applies only V2 onward. baseline-version MUST equal V1's own version:
# baselining at version 0 (a value that looks intuitive but is wrong — verified against a
# real pre-existing database) leaves V1 "newer than the baseline", so Flyway still tries to
# execute it against tables that already exist and fails with a duplicate-relation error.
# A genuinely empty database has no tables to baseline against, so Flyway ignores baseline*
# entirely there and simply runs V1 then V2 in full, as normal.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ──── JWT Configuration ────
# JWT_SECRET must be set as an environment variable outside local dev; the
# fallback below is a dev-only default and must never be used in production.
jwt.secret=${JWT_SECRET:wajba-dev-secret-key-change-this-in-production-must-be-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ──── Cookie Configuration ────
cookie.secure=false
cookie.same-site=Lax

# ──── Jackson ────
# Accept a request-body enum value regardless of case (e.g. role: "customer") so it binds
# instead of throwing HttpMessageNotReadableException; a value that is still not a valid enum
# constant after this (e.g. role: "banana") still 400s via GlobalExceptionHandler.
spring.jackson.mapper.accept-case-insensitive-enums=true

# ──── Reviews (BACKEND-005) ────
# GET /api/v1/reviews (homepage testimonials strip): surface only reviews that carry a written
# comment and a rating >= min-rating, ordered highest-rating then newest, capped at `limit` rows.
# A fresh database with no reviews yet correctly returns an empty list.
app.reviews.testimonials.min-rating=4
app.reviews.testimonials.limit=12

# ──── Password Reset (BACKEND-009) ────
# POST /api/v1/auth/forgot-password issues a single-use token (only its SHA-256 hex hash is
# stored in password_reset_tokens) and hands the raw token to a PasswordResetMailer;
# POST /api/v1/auth/reset-password consumes it and sets the new password.
#
# Mail transport is OPTIONAL and unset here. With no spring.mail.host, Spring Boot configures no
# JavaMailSender and the app falls back to LoggingPasswordResetMailer — a DEV-ONLY mailer that
# logs the reset link at INFO and WARNs on every call that no transport is configured. A real
# deployment MUST set spring.mail.* so JavaMailSenderPasswordResetMailer sends an actual email —
# uncomment and fill in:
#   spring.mail.host=smtp.example.com
#   spring.mail.port=587
#   spring.mail.username=apikey
#   spring.mail.password=${SMTP_PASSWORD:}
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
#   spring.mail.from=no-reply@foodhub.example
#
# ttl: ISO-8601 duration a reset token stays valid (ForgotPasswordPage says "link valid 30 minutes").
# link-base: the raw token is appended to this to form the emailed link.
app.password-reset.ttl=PT30M
app.password-reset.link-base=http://localhost:5173/reset-password?token=

# ──── Platform Settings seed (BACKEND-010) ────
# PlatformSettingsInitializer inserts the singleton platform_settings row on startup if it is
# missing, so GET /api/v1/admin/settings never returns a null supportEmail that a subsequent
# PUT (which requires @NotBlank @Email) would then reject. Idempotent — skipped when the row
# already exists.
app.platform-settings.default-support-email=${PLATFORM_SUPPORT_EMAIL:support@wajba.local}
app.platform-settings.default-delivery-fee=${PLATFORM_DEFAULT_DELIVERY_FEE:15.00}
app.platform-settings.default-commission-percentage=${PLATFORM_DEFAULT_COMMISSION:0.00}

# ──── Admin Bootstrap ────
# Optional one-time seed of a ROLE_ADMIN account on startup (AdminAccountInitializer).
# Both email and password must be provided — as environment variables outside local dev —
# for the seed to run; it is skipped when either is blank or a user with that email already
# exists. There is no self-service way to obtain the ADMIN role (AuthService.register rejects it).
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Platform Admin}
